{% extends "master.html" %}

{% block title %}Login{% endblock title %}

{% block content %}
<center>
    <div class="row">
        <center>
            <div class="col-md-4 py-5">
                <section>
                    <form id="account" method="post" class="py-5">
                        <h2>Login Into Your Account</h2>
                        <hr />
                        <div asp-validation-summary="ModelOnly" class="text-danger" role="alert"></div>
                        <div class="form-floating mb-3">
                            <input asp-for="Input.Email" class="form-control" autocomplete="username" aria-required="true" placeholder="name@example.com" />
                            <label asp-for="Input.Email" class="form-label">Email</label>
                            <span asp-validation-for="Input.Email" class="text-danger"></span>
                        </div>
                        <div class="form-floating mb-3">
                            <input asp-for="Input.Password" class="form-control" autocomplete="current-password" aria-required="true" placeholder="password" />
                            <label asp-for="Input.Password" class="form-label">Password</label>
                            <span asp-validation-for="Input.Password" class="text-danger"></span>
                        </div>
                        <div class="checkbox mb-3">
                            <label for="inputRememberMe" class="form-label">
                                <input type="checkbox" name="inputRememberMe" class="form-check-input" asp-for="Input.RememberMe" />
                                Remember me
                            </label>
                        </div>
                        <div>
                            <button id="login-submit" type="submit" class="w-100 btn btn-lg btn-primary">Log in</button>
                        </div>
                        <div>
                            <p>
                                <a id="forgot-password" asp-page="./ForgotPassword">Forgot your password?</a>
                            </p>
                            <p>
                                <h6>Don't have an account? <a href="/accounts/register" ><u>Register</u></a></h6>
                            </p>
                        </div>
                    </form>
                </section>
            </div>
            <div class="col-md-6 col-md-offset-2">
            </div>
        </center>
    </div>
</center>
{% endblock content %}
