{% extends 'master.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row">
    <center>
        <div class="col-md-4 py-5">
            <h2>Sign Up</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit">Sign Up</button>
                </form>
             <p>
                            <h6>Have an account? <a href="/accounts/login" asp-route-returnUrl="Home/Main"><u>Login</u></a></h6>
                            
                        </p>
        </div>
        <div class="col-md-6 col-md-offset-2">
            </center>
        </div>
    </div>
{% endblock %}
