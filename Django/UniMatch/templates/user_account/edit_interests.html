<!-- templates/user_account/edit_interests.html -->
{% extends "master.html" %}
{% load static %}

{% block title %}Edit Interests{% endblock title %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-12">
            <h2>Edit Interests</h2>
            <hr>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{% url 'details' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
