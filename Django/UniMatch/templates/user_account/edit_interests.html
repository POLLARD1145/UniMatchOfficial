<!-- templates/user_account/edit_interests.html -->
{% extends "master.html" %}
{% load static %}

{% block title %}Edit Interests{% endblock title %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-12">
            <h2>Edit Interests</h2>
            <hr>
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="form-group">
                    {{ form.program.label_tag }}
                    {{ form.program }}
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
